[project]
name = "cards-app"
version = "0.1.0"
description = "ИИ-генератор карточки товара: бэкенд на FastAPI, PostgreSQL + pgvector, Temporal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "temporalio>=1.7",
    "openai>=1.54",
    "torch>=2.5",
    "sentence-transformers>=3.3",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "openai-agents>=0.24.0",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.uv]
# Эмбеддинги считаются на процессоре: берём torch из CPU-индекса, без гигабайтов CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: тесты на живой базе PostgreSQL (нужен make up и миграции)",
    "slow: тесты, которые долго работают (прогон на реальных документах)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["evals/reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
