# Инфраструктура проекта (шаг 2): база с pgvector и движок устойчивого исполнения Temporal.
# Поднять: make up. Приложение и воркер запускаются на хосте: make dev, make worker.
# Имя проекта отдельное, порты по умолчанию другие: соседние стеки на той же машине не конфликтуют.
name: cards-py
services:
  db:
    image: pgvector/pgvector:pg17            # PostgreSQL 17 с уже собранным расширением vector
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: cards
    ports: ["${DB_PORT:-5434}:5432"]        # 5432 часто занят другим Postgres на машине разработчика
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db:/docker-entrypoint-initdb.d:ro   # создаёт базу cards_test для тестов
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cards"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:                                  # движок устойчивых процессов, dev-режим: один контейнер, UI на :8233
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]   # состояние процессов в файле, переживает рестарт
    ports: ["${TEMPORAL_PORT:-7234}:7233", "${TEMPORAL_UI_PORT:-8234}:8233"]
    volumes:
      - temporal-data:/home/temporal       # домашняя папка пользователя temporal: том наследует её права
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data: {}
  temporal-data: {}
